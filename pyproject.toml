[project]
name = "echostream"
version = "0.1.0"
description = "Every swipe echoes. A scaled-down Douyin/TikTok-style For-You recommender + multi-node-on-localhost serving layer on KuaiRec."
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.26,<2.3",
  "pandas>=2.2",
  "pyarrow>=16",
  "scipy>=1.13",
  "torch>=2.4",
  "faiss-cpu>=1.8",
  "lightgbm>=4.3",
  "implicit>=0.7.2",
  "sentence-transformers>=3.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "redis>=5.0",
  "orjson>=3.10",
  "prometheus-client>=0.20",
  "psycopg[binary]>=3.2",
  "psutil>=6.0",
  "scikit-learn>=1.5",
  "uvloop>=0.23.0",
  "httptools>=0.9.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-timeout>=2.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["echostream*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: needs redis/postgres/cluster processes (local only, no network)",
  "data: needs downloaded KuaiRec data + trained artifacts",
]
timeout = 300
